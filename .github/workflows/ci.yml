name: CI

# 为什么要有这个文件
#
# 在这之前，`go test ./...`、`go vet`、`make static`、两条零 token 端到端
# 全靠人记得跑。这个仓库的改动密度很高（一天里网关、组件框架、模块布局都
# 可能同时动），靠记性守不住——尤其是端到端，它锁的正是「真实现场复现出来
# 的那几条」，单测覆盖不到。
#
# 三档对应 docs/10-testing-security.md 的三层粒度：
#
#   static  格式 / vet / 生成清单 / 单测      —— 秒级
#   race    带竞态检测的单测                  —— 只跑并发相关包
#   e2e     真二进制 + 假上游 + 假客户端      —— 零 token，覆盖真行为
#
# 需要真 token 的 `mock/e2e_reasoning_affinity.sh` **不在**这里：它会花真钱，
# 只能人工按需跑。
#
# ---- 触发条件：只在 main 上跑（2026-09-18 改）----
#
# 开发流程是「从 main 切分支 → 干完合回 main」，所以**只有合进 main 的那一下**
# 需要一次权威判定。之前 `push: branches: [main, "feature/**"]` 加 `pull_request:`
# 是每推一次分支、每开一个 PR 都跑一轮，run 列表里大半是还没定稿的中间态——
# 真正要看的「main 现在绿不绿」反而被埋了。
#
# 这个取舍有代价，要说清楚：**没有 PR 门禁了**。合进 main 之前不再有自动判定，
# 所以「推之前先本地跑 `make ci`」从好习惯变成了流程的一部分——那条
# 命令在本地复刻下面这三档（含干净 runner 的配置目录），见 Makefile 的
# `ci` 目标。坏的 main 比坏的 PR 严重得多：main 一红，所有人下次拉下来都是红的。
#
# `workflow_dispatch` 保留：偶尔需要在某个分支上手动验一次（比如动了 CI 本身），
# 那是显式动作，不会自己堆记录。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支上后一次推送取消前一次未跑完的：main 上连续合入时，中间那次的结果
# 已经没人会看了，留着只是刷屏。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: 静态检查与单测
    runs-on: ubuntu-latest
    defaults:
      run:
    # runner 本来就是干净的，这里仍然**显式**钉住配置目录：让「测试偷偷依赖
    # 运行它的那台机器上的配置」在任何 runner 上都必然暴露，而不是碰运气。
    # 与本地 `make ci` 的沙箱同一个意图（那条命令就是照它写的）。
    #
    # 路径写成**字面量**，不用 `${{ runner.temp }}`：`runner` 上下文在
    # workflow 级 env 里没有，在 `jobs.<id>.env` 里也没有（可用上下文只有
    # github/needs/strategy/matrix/vars/secrets/inputs），只有 step 级才有。
    # 2026-09-18 实测：顶层和 job 级各写一次，两次都让 GitHub 直接拒绝整个
    # workflow——run 0 秒失败报 "workflow file issue"，一个 job 都没起。
    # 字面路径没有上下文依赖，最不容易再踩。
    env:
      NEWGATE_HOME: /tmp/newgate-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 跟 go.mod 走，不写死版本——否则升级 toolchain 时这里会静默落后。
          go-version-file: go.mod
          # 指 go.mod 而不是 go.sum：这个模块**没有第三方依赖**，所以仓库里
          # 根本没有 go.sum。指着一个不存在的文件时 setup-go 算不出缓存键，每次
          # 都报 "Some specified paths were not resolved, unable to cache
          # dependencies" 并退化成不缓存（2026-09-18 实测，三个 job 各报一次）。
          cache-dependency-path: go.mod

      - name: gofmt
        run: make check-fmt

      - name: vet
        run: make vet

      - name: 装配清单是否过期
        run: make check-generate

      # GOPROXY=off 把「内核的构建与测试完全离线」变成 CI 会红的事实，而不是
      # 一句承诺（2026-09-20 起成立：清单只扫本仓库的 modules/，发行版是另一个
      # Go module，不再有构建期 clone）。哪天有人塞回一个构建期外部依赖，
      # 它会在这里以「no required module provides package」现形。
      - name: 单测（离线：内核构建不该出网）
        run: GOPROXY=off go test ./...

  race:
    name: 竞态检测
    runs-on: ubuntu-latest
    defaults:
      run:
    # 与 static 同一个理由（见那里的注释）：钉住配置目录，别让 runner 状态漏进来。
    env:
      NEWGATE_HOME: /tmp/newgate-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # 指 go.mod 而不是 go.sum：这个模块**没有第三方依赖**，所以仓库里
          # 根本没有 go.sum。指着一个不存在的文件时 setup-go 算不出缓存键，每次
          # 都报 "Some specified paths were not resolved, unable to cache
          # dependencies" 并退化成不缓存（2026-09-18 实测，三个 job 各报一次）。
          cache-dependency-path: go.mod

      - run: go test -race ./...

  # 这一档不需要上面那个 env：mock/*.sh 各自 export 自己的沙箱。
  e2e:
    name: 零 token 端到端
    runs-on: ubuntu-latest
    defaults:
      run:
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # 指 go.mod 而不是 go.sum：这个模块**没有第三方依赖**，所以仓库里
          # 根本没有 go.sum。指着一个不存在的文件时 setup-go 算不出缓存键，每次
          # 都报 "Some specified paths were not resolved, unable to cache
          # dependencies" 并退化成不缓存（2026-09-18 实测，三个 job 各报一次）。
          cache-dependency-path: go.mod

      # 两条脚本的依赖：python3（假上游）、curl（打代理）、md5sum（逐字节还原校验）。
      - name: 装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 curl coreutils

      - name: 构建
        run: make build

      - name: opencode 侧端到端
        run: bash mock/e2e.sh

      - name: Claude Code 侧端到端
        run: bash mock/e2e_claude.sh

      # 失败时把沙箱日志带出来——脚本自己会清沙箱，所以只能靠它打到 stdout
      # 的内容。这两步是兜底：把代理日志也捞一份，方便判断是网关行为变了
      # 还是脚本环境不对。
      - name: 失败时导出日志
        if: failure()
        run: |
          for d in /tmp/newgate-e2e.* /tmp/newgate-claude-e2e.*; do
            [ -d "$d" ] || continue
            echo "=== $d ==="
            find "$d" -name '*.log' -exec sh -c 'echo "--- {}"; tail -80 "{}"' \;
          done
