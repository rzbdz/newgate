name: CI

# Why this file exists
#
# Before this, `go test ./...`, `go vet`, `make static` and the two zero-token end-to-end
# runs all relied on people remembering to run them. Change density here is high (gateway,
# component framework and module layout can all move in one day), and memory cannot hold the
# line -- especially the e2e, which pins the cases from a real incident that unit tests miss.
#
# Two tiers (since 2026-11-18):
#
#   static  format / vet / generated manifest / unit tests      -- seconds
#   race    unit tests with the race detector                   -- concurrency-related packages only
#
# There used to be a third tier, end-to-end (real binary + fake upstream + fake client). It moved
# away with the product modules: the kernel ships no gateway, UI or client integration, so its
# own binary has nothing to serve. Every chapter's e2e now runs the distribution's binary
# (newgate-ext's mock/) since the modules live there. The fake upstream stays in this repo,
# reused **by path**, not copied: a copy drifts, and a test green by drift proves nothing.
#
# ---- Triggers: push to main, someone opening a PR, and manual runs (changed 2026-09-20) ----
#
# The flow is "branch off main -> merge back into main", so **only the moment something lands
# in main** needs an authoritative verdict. On 2026-09-18 it was cut down to `push` alone: at
# the time that meant `push: branches: [main, "feature/**"]` **plus** `pull_request:`, so every
# branch push and every PR ran a round, and most of the run list was unfinalized work in
# progress -- what mattered, "is main green right now", got buried.
#
# 2026-09-20 brought `pull_request` back (**without** re-adding `feature/**`): PRs alone do not
# flood the list -- one round per PR, a new push cancels the old one via the concurrency block
# below -- and this repo's README now openly invites forks, so a submitted PR should not mean
#
# To be clear, this is **not a gate**. A gate = branch protection on main + these two jobs
# marked required, which costs direct pushes to main (every change needs a PR). The trade-off
# now is not to do that: direct pushes stay the main path, so running `make ci` locally
# before pushing is still part of the process -- it reproduces both tiers below (incl. a clean
# runner config dir); see the `ci` target in the Makefile. A broken main hurts far more:
#
# `workflow_dispatch` is kept: occasionally something needs a manual check on a branch (e.g.
# when CI itself changed), which is an explicit action that does not pile up records on its own.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A later push on the same branch cancels an unfinished earlier one: when commits land in main
# back to back, nobody will look at the middle run's result, so keeping it only floods the list.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    # The runner is clean anyway, but the config directory is still pinned **explicitly**: so a
    # test secretly depending on the runner machine's config necessarily surfaces on any runner,
    # not by luck. Same intent as local `make ci`'s sandbox (that command was written to mirror it).
    #
    # The path is written as a **literal**, not `${{ runner.temp }}`: the `runner` context is not
    # available in workflow-level env, nor in `jobs.<id>.env` (the available contexts are only
    # github/needs/strategy/matrix/vars/secrets/inputs); only step level has it.
    # Measured 2026-09-18: written once at top level and once at job level, both made GitHub
    # reject the entire workflow -- the run failed in 0 seconds with "workflow file issue", no
    # job started. A literal path has no context dependency and is hardest to trip over again.
    env:
      NEWGATE_HOME: /tmp/newgate-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Follow go.mod and do not hardcode the version -- otherwise this silently lags behind when the toolchain is upgraded.
          go-version-file: go.mod
          # Point at go.mod, not go.sum: this module **has no third-party dependencies**, so the
          # repo has no go.sum at all. Pointed at a nonexistent file, setup-go cannot compute a
          # cache key and every time reports "Some specified paths were not resolved, unable to
          # cache dependencies" and degrades to no caching (measured 2026-09-18, once in each of three jobs).
          cache-dependency-path: go.mod

      - name: gofmt
        run: make check-fmt

      - name: vet
        run: make vet

      - name: Is the assembly manifest stale
        run: make check-generate

      # Localization: whether the ledger is stale, whether translation placeholders match,
      # whether there are orphan keys, how much Chinese remains unmigrated in the source. All
      # offline and free -- LLM translation (tools/i18n sync) runs locally only, never in CI.
      - name: Localization (ledger and catalogs)
        run: make check-i18n

      # GOPROXY=off turns "the kernel builds and tests fully offline" into a fact that goes red
      # in CI, not a promise (true since 2026-09-20: the manifest scans only this repo's
      # modules/, and the distribution is another Go module, no build-time clone). If a
      # build-time external dependency creeps back in, it surfaces here as "no required module provides package".
      - name: Unit tests offline (the kernel build should not go to the network)
        run: GOPROXY=off go test ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    # Same reason as static (see the comment there): pin the config directory so runner state
    env:
      NEWGATE_HOME: /tmp/newgate-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Point at go.mod, not go.sum: this module **has no third-party dependencies**, so the
          # repo has no go.sum at all. Pointed at a nonexistent file, setup-go cannot compute a
          # cache key and every time reports "Some specified paths were not resolved, unable to
          # cache dependencies" and degrades to no caching (measured 2026-09-18, once in each of three jobs).
          cache-dependency-path: go.mod

      - run: go test -race ./...

