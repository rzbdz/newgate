name: CI

# 为什么要有这个文件
#
# 在这之前，`go test ./...`、`go vet`、`make static`、两条零 token 端到端
# 全靠人记得跑。这个仓库的改动密度很高（一天里网关、组件框架、模块布局都
# 可能同时动），靠记性守不住——尤其是端到端，它锁的正是「真实现场复现出来
# 的那几条」，单测覆盖不到。
#
# 两档（2026-11-18 起）：
#
#   static  格式 / vet / 生成清单 / 单测      —— 秒级
#   race    带竞态检测的单测                  —— 只跑并发相关包
#
# 原来还有一档端到端（真二进制 + 假上游 + 假客户端）。它跟着产品模块搬走了：
# 内核不再带网关、界面和客户端接入，它自己的二进制没有东西可以服务。每一章
# 原来在这里跑的端到端，现在跑发行版的二进制（newgate-ext 的 mock/），因为
# 那些模块住在那里。假上游（mock/fake_upstream.py）留在本仓库——发行版按**路径**
# 复用它，不复制：复制品会漂移，漂移出来的绿测试什么也不证明。
#
# ---- 触发条件：push 到 main、有人开 PR、以及手动（2026-09-20 改）----
#
# 开发流程是「从 main 切分支 → 干完合回 main」，所以**只有合进 main 的那一下**
# 需要一次权威判定。2026-09-18 因此砍到只剩 `push`：那时是
# `push: branches: [main, "feature/**"]` **加** `pull_request:`，每推一次分支、
# 每开一个 PR 都跑一轮，run 列表里大半是还没定稿的中间态——真正要看的「main
# 现在绿不绿」反而被埋了。
#
# 2026-09-20 把 `pull_request` 加回来（**不**加回 `feature/**`）：只留 PR 不会刷屏
# ——一个 PR 一轮，新推送由下面的 concurrency 取消旧的——而本仓库的 README 现在
# 明着招人 fork，别人提上来的 PR 不该是一句「没人检查」。
#
# 要说清楚它**不是门禁**。门禁 = main 上开分支保护 + 把这三个 job 设成 required，
# 代价是以后不能直推 main（每次改动都得开 PR）。当前取舍是不那么做：直推仍是主
# 路径，所以「推之前先本地跑 `make ci`」依然算流程的一部分——那条命令在本地复刻
# 下面这三档（含干净 runner 的配置目录），见 Makefile 的 `ci` 目标。坏的 main 比
# 坏的 PR 严重得多：main 一红，所有人下次拉下来都是红的。
#
# `workflow_dispatch` 保留：偶尔需要在某个分支上手动验一次（比如动了 CI 本身），
# 那是显式动作，不会自己堆记录。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支上后一次推送取消前一次未跑完的：main 上连续合入时，中间那次的结果
# 已经没人会看了，留着只是刷屏。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: 静态检查与单测
    runs-on: ubuntu-latest
    # runner 本来就是干净的，这里仍然**显式**钉住配置目录：让「测试偷偷依赖
    # 运行它的那台机器上的配置」在任何 runner 上都必然暴露，而不是碰运气。
    # 与本地 `make ci` 的沙箱同一个意图（那条命令就是照它写的）。
    #
    # 路径写成**字面量**，不用 `${{ runner.temp }}`：`runner` 上下文在
    # workflow 级 env 里没有，在 `jobs.<id>.env` 里也没有（可用上下文只有
    # github/needs/strategy/matrix/vars/secrets/inputs），只有 step 级才有。
    # 2026-09-18 实测：顶层和 job 级各写一次，两次都让 GitHub 直接拒绝整个
    # workflow——run 0 秒失败报 "workflow file issue"，一个 job 都没起。
    # 字面路径没有上下文依赖，最不容易再踩。
    env:
      NEWGATE_HOME: /tmp/newgate-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 跟 go.mod 走，不写死版本——否则升级 toolchain 时这里会静默落后。
          go-version-file: go.mod
          # 指 go.mod 而不是 go.sum：这个模块**没有第三方依赖**，所以仓库里
          # 根本没有 go.sum。指着一个不存在的文件时 setup-go 算不出缓存键，每次
          # 都报 "Some specified paths were not resolved, unable to cache
          # dependencies" 并退化成不缓存（2026-09-18 实测，三个 job 各报一次）。
          cache-dependency-path: go.mod

      - name: gofmt
        run: make check-fmt

      - name: vet
        run: make vet

      - name: 装配清单是否过期
        run: make check-generate

      # 本地化：账本是否过期、译文占位符是否对得上、有没有孤儿键、
      # 源码里还剩多少中文未迁移。全部离线、不花钱——要调 LLM 的翻译
      # （tools/i18n sync）只在开发者本地跑，不进 CI。
      - name: 本地化（账本与目录）
        run: make check-i18n

      # GOPROXY=off 把「内核的构建与测试完全离线」变成 CI 会红的事实，而不是
      # 一句承诺（2026-09-20 起成立：清单只扫本仓库的 modules/，发行版是另一个
      # Go module，不再有构建期 clone）。哪天有人塞回一个构建期外部依赖，
      # 它会在这里以「no required module provides package」现形。
      - name: 单测（离线：内核构建不该出网）
        run: GOPROXY=off go test ./...

  race:
    name: 竞态检测
    runs-on: ubuntu-latest
    # 与 static 同一个理由（见那里的注释）：钉住配置目录，别让 runner 状态漏进来。
    env:
      NEWGATE_HOME: /tmp/newgate-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # 指 go.mod 而不是 go.sum：这个模块**没有第三方依赖**，所以仓库里
          # 根本没有 go.sum。指着一个不存在的文件时 setup-go 算不出缓存键，每次
          # 都报 "Some specified paths were not resolved, unable to cache
          # dependencies" 并退化成不缓存（2026-09-18 实测，三个 job 各报一次）。
          cache-dependency-path: go.mod

      - run: go test -race ./...

